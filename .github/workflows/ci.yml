name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: ruff check app tests smoke_real.py
        working-directory: backend
      - run: pytest -q
        working-directory: backend
        env:
          OPENAI_API_KEY: ''
          LLM_MODEL: ''

  frontend-and-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements-dev.txt
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
        env:
          OPENAI_API_KEY: ''
          LLM_MODEL: ''

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 180
      - name: Verify frontend, preview, and missing-key error
        run: |
          curl --fail --silent http://127.0.0.1:8080/ > /dev/null
          curl --fail --silent http://127.0.0.1:8080/api/health > /dev/null
          curl --fail --silent -F 'file=@examples/postgres.log' http://127.0.0.1:8080/api/preview > /tmp/preview.json
          python -c "import json; d=json.load(open('/tmp/preview.json')); assert '[REDACTED]' in d['lines'][1]['text']; assert 'synthetic-password' not in str(d)"
          status=$(curl --silent -o /tmp/analysis-error.json -w '%{http_code}' -F 'file=@examples/postgres.log' http://127.0.0.1:8080/api/analyze)
          test "$status" = 503
          python -c "import json; assert json.load(open('/tmp/analysis-error.json'))['error']['code'] == 'not_configured'"
      - run: docker compose down --volumes
        if: always()
