server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 72k;
    access_log off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_read_timeout 195s;
        proxy_send_timeout 195s;
        proxy_request_buffering off;
    }

    error_page 413 = @too_large;
    location @too_large {
        default_type application/json;
        return 413 '{"error":{"code":"request_too_large","message":"Upload one file up to 64 KiB (65,536 bytes)."}}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
